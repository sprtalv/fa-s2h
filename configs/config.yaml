defaults:
  - attack: fas2h_mvp
  - model: clip_3surrogate
  - data: toy_pairs
  - eval: none
  - _self_

project:
  name: FA-S2H
  package: fas2h
  current_stage: stage2_mvp

runtime:
  seed: 42
  random_selection_seed: 42
  device: auto
  output_dir: outputs/runs
  auto_name: true
  progress: true

logging:
  record_carrier_target_sim: true
  record_linf: true
  record_pixel_range: true
  record_mean_abs_delta: true
  record_per_model_loss: true
  record_per_layer_loss: true
  record_score_decomposition: true
  record_high_freq_energy: false

hydra:
  run:
    dir: .
  output_subdir: null
